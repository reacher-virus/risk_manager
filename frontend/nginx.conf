server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  error_page 404 /404.html;                       # custom page for missing files (unknown app routes get the in-app 404)
  location = /404.html { internal; }

  # Strict CSP: only our own scripts run, so injected markup cannot execute. (Inline style *attributes* are allowed
  # because the chart library sets them; inline <script> and event-handler attributes are not.)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

  location / { try_files $uri /index.html; add_header Cache-Control "no-store" always; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable" always; }
}
