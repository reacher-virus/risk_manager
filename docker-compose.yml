# docker compose up --build        (copy .env.example to .env first; compose refuses to start without the required secrets)
#   https://${DOMAIN:-localhost}      dashboard      https://${DOMAIN:-localhost}/api/docs  is disabled in production
# The first backend start trains the model (a couple of minutes); it is cached in the `riskdata` volume.
# NOTE: authored without being able to run Docker in the build environment: please smoke-test it once.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: risk
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U risk"], interval: 5s, timeout: 3s, retries: 10 }

  backend:
    build: ./backend
    expose: ["8000"]                    # reachable only by the proxy, never published to the host
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: "postgresql+psycopg2://risk:${POSTGRES_PASSWORD}@db:5432/risk"
      JWT_SECRET: "${JWT_SECRET:?generate one with python -m app.auth.secrets}"
      FRONTEND_URL: https://${DOMAIN:-localhost}
      CORS_ORIGINS: https://${DOMAIN:-localhost}
      ALLOWED_HOSTS: ${DOMAIN:-localhost}
      FORCE_HTTPS: "true"
      COOKIE_SECURE: "true"
      COOKIE_REFRESH_PATH: /api/auth
      TRUSTED_PROXY_COUNT: "1"          # exactly one proxy (Caddy) sits in front
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-Risk Manager <no-reply@localhost>}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}     # optional first-admin bootstrap: remove ADMIN_PASSWORD from .env afterwards
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes: [riskdata:/data]
    depends_on: { db: { condition: service_healthy } }

  frontend:
    build:
      context: ./frontend
      args: { VITE_API_BASE: /api }
    expose: ["80"]

  proxy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:-localhost}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [backend, frontend]

volumes: { pgdata: {}, riskdata: {}, caddy_data: {}, caddy_config: {} }
